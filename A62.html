<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        var a = 56;  //numeric value(integer)
        var b = 7.8; // numeric value(float)
        var c = false;   // boolean
        var d = null; // null value
        var e = undefined; // undefined
        var f = "om";  // string value

        console.log(a);
        console.log(b);
        console.log(c);
        console.log(d);
        console.log(e);
        console.log(f);
    </script>
</body>
</html>
